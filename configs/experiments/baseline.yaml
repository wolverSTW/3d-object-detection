defaults:
  - dataset: kitti
  - model: yolo3d_baseline

training:
  epochs: 100
  batch_size: 8
  learning_rate: 0.001
  optimizer: adamw
  scheduler: cosine
  seed: 42
  log_every_n_steps: 20

output:
  experiment_name: baseline
  save_dir: experiments/baseline
  checkpoint_dir: experiments/baseline/checkpoints
  log_dir: experiments/baseline/logs
  metrics_dir: experiments/baseline/metrics
